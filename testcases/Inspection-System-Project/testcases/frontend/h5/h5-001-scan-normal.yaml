# 机房巡检系统 - H5 扫码巡检（全正常）完整闭环
#
# 用途: 验证「手机 H5 扫码 → 解析点位 → 逐项判定 → 提交 → PC 后台可见」主链路
# 前置: 点位已配置巡检项（pc-005），且本周期内未巡检过（否则会被服务端拒绝）
# 扫码: H5 的 uni.scanCode 在浏览器中不可用，本用例走「手动输入点位编码」通道，
#       与扫码共用同一个 resolve 接口，业务等价

test_id: "INSP-H5-001-scan-normal"
title: "H5 扫码巡检：解析点位、逐项正常判定、提交成功"
priority: "P0"
tags: ["H5", "扫码巡检", "闭环", "冒烟"]
author: "testcase-modeler (机房巡检系统)"

context_check:
  login_url: "${H5_URL}/#/pages/login/index"
  home_indicator: "扫码巡检"
  credentials:
    username: "${H5_USER}"
    password: "${H5_PASS}"
  captcha_required: false

steps:
  - step: 1
    desc: "打开 H5 登录页"
    action: navigate
    url: "${H5_URL}/#/pages/login/index"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: text_contains
        expected: "登 录"
        confidence: medium

  - step: 2
    desc: "输入账号"
    action: fill
    target: "请输入账号"
    value: "${H5_USER}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 3
    desc: "输入密码"
    action: fill
    target: "请输入密码"
    value: "${H5_PASS}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 4
    desc: "点击「登 录」并等待登录完成（⚠️ /auth/login 实测 2~9s，等待必须大于该耗时）"
    action: click
    target: "登 录"
    wait_after:
      type: time
      duration: 12000
    assertions:
      # 这里刻意不放「登录成功」断言：
      #   1) network_called 在本引擎恒为 "network check skipped"，等于没校验；
      #   2) element_hidden/element_visible 走 find_uid，模糊打分无最低分阈值，
      #      拿"是不是 textbox"也能拿 20 分，会命中不相干元素（实测误报）。
      # 真正的登录成功判据放在步骤 5：受保护页 /pages/inspect/scan 能加载出来，
      # 就说明 token 已就绪（否则会被 onLaunch 的会话校验踢回登录页）。
      - type: network_called
        url_pattern: "*/login"
        method: POST
        response_code: 200
        confidence: high

  - step: 5
    desc: "进入「扫码巡检」页"
    action: navigate
    url: "${H5_URL}/#/pages/inspect/scan"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: text_contains
        expected: "扫码巡检"
        confidence: high
      - type: element_visible
        target: "扫一扫"
        confidence: high

  - step: 6
    desc: "在「二维码磨损？手动输入点位编码」输入框中填入点位编码（等价扫码）"
    action: fill
    target: "例如 RM-A-001"
    value: "${POINT_CODE}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 7
    desc: "点击「查询」，调用扫码解析接口"
    action: click
    target: "查询"
    wait_after:
      type: time
      duration: 3000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/scan/resolve*"
        method: POST
        response_code: 200
        response_body_contains:
          - '"code":200'
        confidence: high

  - step: 8
    desc: "验证跳转到「巡检执行」页，且点位信息卡显示点位名称/编码/机房/周期"
    action: assert_multiple
    assertions:
      - type: text_contains
        expected: "${POINT_NAME}"
        confidence: high
      - type: text_contains
        expected: "${POINT_CODE}"
        confidence: medium
      - type: text_contains
        expected: "上次巡检"
        confidence: medium

  - step: 9
    desc: "断言未出现「本周期已巡检」告警（若出现说明测试点位需换一个或清理上周期记录）"
    action: assert_multiple
    assertions:
      - type: element_hidden
        target: "本周期已巡检"
        confidence: high

  - step: 10
    desc: "为第 1 个巡检项选择「正常」"
    action: click
    target: "正常"
    wait_after:
      type: time
      duration: 500
    assertions:
      - type: element_visible
        target: "已填"
        confidence: low

  - step: 11
    desc: "为第 2 个巡检项选择「正常」（模板现为单项时自动跳过）"
    # 演变史：旧写法 click 正常 两次都点第 1 个 → @2 语法修复多点位；但
    # run-20260930 批次 pc-004 已删除模板「指示灯状态」明细行并保存成功
    # （DB 实锤：自动化测试模板-0930092802 仅剩「机房温度」1 项），执行页
    # 只有 1 组判定钮（snap-093453 仅 1 个「正常」StaticText）→「正常@2」
    # 恒「未定位到目标元素」假失败。改 js 条件点击：内层去重后判定组 ≥2
    # 才点第 2 组，否则显式 skip（js 返回非 error 前缀 = 步骤 PASS），
    # 单项/多项点位两种形态都兼容。
    action: js
    script: |
      const norm = s => (s || '').replace(/\s+/g, '');
      const all = [...document.querySelectorAll('uni-view, uni-text, uni-button, button')]
        .filter(b => norm(b.textContent) === '正常' && b.offsetParent !== null);
      // 内层去重：包裹层与内层 textContent 相同会重复计数（1 组被数成 2）
      const leafs = all.filter(b => !all.some(o => o !== b && b.contains(o)));
      if (leafs.length >= 2) { leafs[1].click(); return 'ok: clicked 2nd 正常, 判定组=' + leafs.length; }
      return 'skip: 判定组=' + leafs.length + '（单巡检项点位，pc-004 删除明细行后的预期形态）';
    wait_after:
      type: time
      duration: 500
    assertions:
      - type: element_visible
        target: "已填"
        confidence: low

  - step: 12
    desc: "填写「整体备注」"
    action: fill
    target: "本点位整体情况说明"
    value: "${H5_OVERALL_REMARK}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 13
    desc: "点击「提交巡检」"
    action: click
    target: "提交巡检"
    wait_after:
      type: time
      duration: 3500
    assertions:
      - type: network_called
        url_pattern: "*/inspect/record/submit*"
        method: POST
        response_code: 200
        response_body_contains:
          - '"code":200'
        confidence: high
      - type: toast_visible
        expected: "巡检记录已提交"
        confidence: high

  - step: 14
    desc: "打开「我的记录」页，验证刚提交的记录出现在列表中（提交成功后页面常已自动跳转，「我的记录」入口按钮不再在快照里，navigate 直达更稳）"
    action: navigate
    url: "${H5_URL}/#/pages/inspect/records"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: network_called
        url_pattern: "*/inspect/record/my*"
        method: GET
        response_code: 200
        confidence: medium
      - type: text_contains
        expected: "${POINT_NAME}"
        confidence: high

teardown:
  - action: screenshot
    name: "h5-scan-normal-{timestamp}.png"
    fullPage: true
  - action: log
    message: "该记录将作为 PC 端 pc-008 / pc-011 用例的数据来源"

metadata:
  created_by: "testcase-modeler v2.0.1"
  test_environment: "local"
  browser: "chromium (移动视图 390x844)"
  estimated_duration: "60-90s"
  risk_level: "high"
  note: "risk_level=high：本用例会写入一条巡检记录，并锁定该点位本周期；重跑前需清理或更换点位"
