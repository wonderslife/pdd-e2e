# 机房巡检系统 - 点位管理 CRUD（含「从模板导入」巡检项）
#
# 用途: 验证点位新增时关联下拉联动、从模板导入明细、保存后明细回显
# 依赖: 机房（pc-002）、区域（pc-003）、模板+明细（pc-004）

test_id: "INSP-PC-005-point-crud"
title: "点位管理：新增点位并从模板导入巡检项，修改时明细回显"
priority: "P0"
tags: ["点位管理", "模板导入", "主子表", "PC", "回归"]
author: "testcase-modeler (机房巡检系统)"

context_check:
  login_url: "${PC_URL}/index"
  home_indicator: "机房巡检"
  credentials:
    username: "${PC_USER}"
    password: "${PC_PASS}"
  captcha_required: false

steps:
  - step: 1
    desc: "进入「机房巡检 > 点位管理」页面"
    action: navigate
    url: "${PC_URL}/inspect/point"
    wait_after:
      type: time
      duration: 2000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/point/list*"
        method: GET
        response_code: 200
        confidence: high

  - step: 2
    desc: "点击「新增」，打开新增点位窗口"
    action: click
    target: "新增"
    wait_after:
      type: time
      duration: 1200
    assertions:
      - type: element_visible
        target: "点位名称"
        confidence: high

  - step: 3
    desc: "「所属机房」下拉选择目标机房（验证机房选项已加载）"
    action: select_option
    target: "请选择机房"
    option: "${ROOM_NAME}"
    assertions:
      - type: element_text
        expected: "${ROOM_NAME}"
        confidence: high

  - step: 4
    desc: "「所属区域」下拉选择「${AREA_NAME}」（区域随机房联动）"
    action: select_option
    target: "请选择区域"
    option: "${AREA_NAME}"
    assertions:
      - type: element_text
        expected: "${AREA_NAME}"
        confidence: medium

  - step: 5
    desc: "填入「点位名称」"
    action: fill
    target: "请输入点位名称"
    value: "${POINT_NAME}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 6
    desc: "填入「点位编码」（全局唯一）"
    action: fill
    # target 必须是界面上**真实存在的字段标签**。原先写的是 desc 里的括注「全局唯一」，
    # 快照里根本没有这个字样 → P1a/P1b 精确层必然 Miss → 落到 P1c 模糊层，
    # 给列表页背后那个同名的「点位编码」搜索框打了 score=25 就静默返回，
    # 于是弹窗里的「点位编码」始终为空，后端必填校验拦下提交，点位一条也建不出来。
    # 写成「点位编码」后，精确层命中弹窗内的「* 点位编码」，且 in_modal 权重压过背后的搜索框。
    target: "点位编码"
    value: "${POINT_CODE}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 7
    desc: "填入「位置描述」"
    action: fill
    # 同上：原先 target 写「机柜」是照抄变量值里的字样，快照里并无该文本节点。
    # 「位置描述」只在弹窗内存在（列表页只有列头文本），精确层可唯一定位。
    target: "位置描述"
    value: "${POINT_LOCATION}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 8
    desc: "「巡检周期」选择「每日」"
    action: select_option
    target: "请选择巡检周期"
    option: "每日"
    assertions:
      - type: element_text
        expected: "每日"
        confidence: high

  # ===== 必填项补齐：点位状态 =====
  # 本轮实测发现的套件缺口：新增点位弹窗有 **6 个必填项**（所属机房 / 点位名称 /
  # 点位编码 / 巡检周期 / 点位状态），而本用例原来只填了 5 个，漏了「点位状态」。
  # 后果是点「确 定」后 Element Plus 的 el-form **前端校验直接拦下、根本不发请求**
  # （后端 sys-console.log 全程只有 GET /inspect/point/list，没有任何 POST），
  # 于是数据造不出来、成功 toast 不出现，而弹窗一直开着，
  # 后续「按名称搜索 / 修改回显」几步全都落在弹窗内部元素上、变成假阳性。
  # 快照铁证：snap-...-132352.txt 弹窗 description 完整带出 5 项已填值，
  # 但同页存在 StaticText「点位状态不能为空」(uid=50_1)。
  - step: 9
    desc: "「点位状态」选择「启用」"
    action: select_option
    target: "点位状态"
    option: "启用"
    assertions:
      - type: element_text
        expected: "启用"
        confidence: high

  # ===== 核心回归点：从模板导入巡检项 =====
  - step: 10
    desc: "在巡检项子表格上方的「从模板导入」下拉中选择「${TPL_NAME}」"
    # 与步骤28 同因：combobox text=''，模糊匹配脆弱（本轮 score=55 侥幸命中，
    # 换个 generation 就会 fallback 到搜索区 combobox）→ js 按 placeholder 精确定位
    action: js
    script: |
      const dlg = [...document.querySelectorAll('.el-dialog')].find(d => d.offsetParent !== null);
      if (!dlg) return 'error: point dialog not found';
      // 结构定位：「从模板导入」是弹窗里唯一放在 el-divider 内部的 el-select
      // （form.vue L67-80）。placeholder 属性匹配不可靠（2.14.3 渲染路径不定）。
      const sel = dlg.querySelector('.el-divider .el-select');
      if (!sel) return 'error: template import select not found in dialog divider';
      const wrapper = sel.querySelector('.el-select__wrapper') || sel.querySelector('.el-input__wrapper') || sel;
      wrapper.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
      wrapper.click();
      return new Promise(resolve => {
        let n = 0;
        const tick = () => {
          const dds = [...document.querySelectorAll('.el-select-dropdown')].filter(d => d.offsetParent !== null);
          for (const dd of dds) {
            const opt = [...dd.querySelectorAll('.el-select-dropdown__item')].find(o => (o.textContent || '').includes('${TPL_NAME}'));
            if (opt) { opt.click(); resolve('ok: template imported'); return; }
          }
          if (++n > 10) { resolve('error: option not appeared, visible dropdowns=' + dds.length); return; }
          setTimeout(tick, 300);
        };
        setTimeout(tick, 300);
      });
    wait_after:
      type: time
      duration: 1500
    assertions:
      # 模板下必须真的有明细，否则会提示「该模板下没有巡检项明细」
      - type: text_contains
        expected: "${TPL_ITEM_NAME_1}"
        confidence: high

  - step: 11
    desc: "断言页面未出现「没有巡检项明细」类提示，且子表格已带出模板明细"
    action: assert_multiple
    assertions:
      - type: element_hidden
        target: "没有巡检项明细"
        confidence: high
      - type: element_visible
        target: "${TPL_ITEM_NAME_1}"
        confidence: high

  - step: 12
    desc: "在导入的明细行上补充「判定标准」，验证导入行可继续编辑"
    action: fill
    target: "18~27℃"
    value: "${TPL_STANDARD_1}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 13
    desc: "点击「确 定」提交，点位与其巡检项一并保存"
    action: click
    target: "确 定"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: network_called
        url_pattern: "*/inspect/point"
        method: POST
        response_code: 200
        response_body_contains:
          - '"code":200'
        confidence: high
      - type: toast_visible
        expected: "成功"
        confidence: high

  # ===== 列表展示回归点 =====
  # 产品行为：新增点位成功后前端会自动弹出「点位二维码」modal 弹窗（index.vue L293-300
  # 「新增成功，已生成二维码」→ qrcodeOpen=true）。第 3 轮实测该 modal 遮罩一直没关，
  # 把步骤16「修改」、步骤19「新增」的点击整个吞掉（Puppeteer 报成功、实际点在遮罩上），
  # 步骤20-23 全填到列表搜索区控件（element_text 假阳性通过），步骤24 起级联崩
  # —— 全用例 78.6% 的总根因。必须显式关闭后才能继续操作工具栏。
  - step: 14
    desc: "关闭新增成功后自动弹出的「点位二维码」弹窗"
    action: click
    target: "关 闭"
    wait_after:
      type: time
      duration: 1000
    assertions:
      - type: element_hidden
        target: "下载图片"
        confidence: high

  - step: 15
    desc: "按点位名称过滤，验证列表的「所属机房」「所属区域」列有值（不是空白或 ID）"
    action: fill
    target: "请输入点位名称"
    value: "${POINT_NAME}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 16
    desc: "点击「搜索」，校验关联名称列与状态列正常展示"
    action: click
    target: "搜索"
    wait_after:
      type: time
      duration: 1500
    assertions:
      - type: text_contains
        expected: "${ROOM_NAME}"
        confidence: high
      - type: text_contains
        expected: "启用"
        confidence: medium

  # ===== 修改回显 =====
  - step: 17
    desc: "点击该行「修改」，验证巡检项明细在表单中回显"
    action: click
    target: "修改"
    wait_after:
      type: time
      duration: 2000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/point/*"
        method: GET
        response_code: 200
        confidence: medium
      - type: text_contains
        expected: "${TPL_ITEM_NAME_1}"
        confidence: high

  - step: 18
    desc: "修改备注后保存"
    action: fill
    target: "请输入备注"
    value: "${POINT_REMARK}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 19
    desc: "点击「确 定」保存修改"
    action: click
    target: "确 定"
    wait_after:
      type: time
      duration: 2000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/point"
        method: PUT
        response_code: 200
        confidence: high
      - type: toast_visible
        expected: "成功"
        confidence: high

  # ===== 数据准备：创建第二个点位（自动化测试点位-02） =====
  # 背景：h5-002（异常提交）与 pc-010（异常处理）依赖「点位-02」，但全套件原本
  # 没有任何用例创建它 —— h5-002 的注释只写「前置: 点位 2 已配置巡检项」，
  # cleanup 每轮清空数据后这两条用例必然失败（实测 37.5% / 53.8%）。
  # 点位名称无唯一索引可静态复用；点位编码全局唯一（uk_point_code），
  # 必须带 RUN_TAG。此处是纯数据准备，断言从简。
  - step: 20
    desc: "点击「新增」，再次打开新增点位窗口（数据准备：点位-02）"
    action: click
    target: "新增"
    wait_after:
      type: time
      duration: 1200
    assertions:
      # 弹窗特有文本判据。注意：「从模板导入」是 el-select（combobox），
      # 快照里 text=''（placeholder 不进 accessible text），element_visible 恒找不到
      # —— 改用弹窗内分组标题「巡检项清单」（divider 文本，列表页无此文本）
      - type: element_visible
        target: "巡检项清单"
        confidence: high

  - step: 21
    desc: "「所属机房」下拉选择「${ROOM_NAME}」"
    action: select_option
    target: "请选择机房"
    option: "${ROOM_NAME}"
    assertions:
      - type: element_text
        expected: "${ROOM_NAME}"
        confidence: high

  - step: 22
    desc: "「所属区域」下拉选择「${AREA_NAME}」"
    action: select_option
    target: "请选择区域"
    option: "${AREA_NAME}"
    assertions:
      - type: element_text
        expected: "${AREA_NAME}"
        confidence: medium

  - step: 23
    desc: "填入「点位名称」（静态名，无唯一索引，h5-002/pc-010 按此名引用）"
    action: fill
    target: "请输入点位名称"
    value: "${POINT_2_NAME}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 24
    desc: "填入「点位编码」（uk_point_code 唯一索引 → 必须带 RUN_TAG）"
    action: fill
    target: "点位编码"
    value: "${POINT_CODE_2}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 25
    desc: "填入「位置描述」"
    action: fill
    target: "位置描述"
    value: "${POINT_2_LOCATION}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 26
    desc: "「巡检周期」选择「每日」"
    action: select_option
    target: "请选择巡检周期"
    option: "每日"
    assertions:
      - type: element_text
        expected: "每日"
        confidence: high

  - step: 27
    desc: "「点位状态」选择「启用」"
    action: select_option
    target: "点位状态"
    option: "启用"
    assertions:
      - type: element_text
        expected: "启用"
        confidence: high

  - step: 28
    desc: "「从模板导入」选择「${TPL_NAME}」（点位-02 需配置巡检项，h5-002 异常提交用）"
    # select_option 模糊匹配踩坑实录：combobox text=''，弹窗内「从模板导入」下拉
    # 没进候选，fallback 命中搜索区「所属区域」combobox（score=25，点开是区域选项）
    # → fill 兜底假成功、模板根本没导入 → 步骤29 被「每个点位至少配置 1 个巡检项」拦截。
    # 改 js 结构定位 el-divider 内的 el-select 全程自选。
    #
    # run-20260930-093204 二坑：点位-01 弹窗选过模板后，点位-02 复用同一 dialog
    # 组件，v-model="templateId" 是**独立 ref**（form.vue L71，watch editData 整体
    # 替换 form 时不重置）→ 下拉残留选中值（快照 108_703 StaticText 实锤），
    # Element Plus 对「同值重选」不触发 change → handleApplyTemplate 不执行 →
    # 清单空。故先经组件实例发 update:modelValue('') 清残留（只发 update 不发
    # change，避免 handleApplyTemplate('') 空参调 API），再点 option；
    # 点完自校验「机房温度」行真的出现在清单里（明细列是 el-input，
    # textContent 读不到值，须查 input.value）。
    action: js
    script: |
      const dlg = [...document.querySelectorAll('.el-dialog')].find(d => d.offsetParent !== null);
      if (!dlg) return 'error: point dialog not found';
      const sel = dlg.querySelector('.el-divider .el-select');
      if (!sel) return 'error: template import select not found in dialog divider';
      try {
        const comp = sel.__vueParentComponent;
        if (comp && comp.emit) comp.emit('update:modelValue', '');
      } catch (e) { /* 组件实例不可达时退化为纯 DOM 流程 */ }
      const wrapper = sel.querySelector('.el-select__wrapper') || sel.querySelector('.el-input__wrapper') || sel;
      wrapper.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
      wrapper.click();
      return new Promise(resolve => {
        let n = 0;
        const tick = () => {
          const dds = [...document.querySelectorAll('.el-select-dropdown')].filter(d => d.offsetParent !== null);
          for (const dd of dds) {
            const opt = [...dd.querySelectorAll('.el-select-dropdown__item')].find(o => (o.textContent || '').includes('${TPL_NAME}'));
            if (opt) {
              opt.click();
              let m = 0;
              const verify = () => {
                const rows = [...dlg.querySelectorAll('.el-table__row')].filter(r => r.offsetParent !== null);
                const hit = rows.some(r => (r.textContent || '').includes('${TPL_ITEM_NAME_1}') ||
                  [...r.querySelectorAll('input')].some(i => (i.value || '').includes('${TPL_ITEM_NAME_1}')));
                if (hit) { resolve('ok: template imported, ${TPL_ITEM_NAME_1} row visible'); return; }
                if (++m > 6) { resolve('error: option clicked but itemList has no ${TPL_ITEM_NAME_1} row'); return; }
                setTimeout(verify, 300);
              };
              setTimeout(verify, 300);
              return;
            }
          }
          if (++n > 10) { resolve('error: option not appeared, visible dropdowns=' + dds.length); return; }
          setTimeout(tick, 300);
        };
        setTimeout(tick, 300);
      });
    wait_after:
      type: time
      duration: 1500
    assertions:
      - type: text_contains
        expected: "${TPL_ITEM_NAME_1}"
        confidence: high

  - step: 29
    desc: "点击「确 定」提交点位-02"
    action: click
    target: "确 定"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: network_called
        url_pattern: "*/inspect/point"
        method: POST
        response_code: 200
        confidence: high
      - type: toast_visible
        expected: "成功"
        confidence: high

teardown:
  - action: screenshot
    name: "point-crud-{timestamp}.png"
    fullPage: true
  - action: log
    message: "点位 ${POINT_NAME}（${POINT_CODE}）与 ${POINT_2_NAME}（${POINT_CODE_2}）已就绪，供二维码与 H5 扫码用例复用"

metadata:
  created_by: "testcase-modeler v2.0.1"
  test_environment: "local"
  viewport: "1920x1080"
  estimated_duration: "70-100s"
  risk_level: "medium"
  note: "步骤 10-11 是核心回归点：模板导入不得再提示「没有巡检项明细」；步骤 9「点位状态」是必填项补齐（漏填会被前端校验拦下、后端收不到 POST）"
