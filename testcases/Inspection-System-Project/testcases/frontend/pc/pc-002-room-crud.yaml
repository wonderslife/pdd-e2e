# 机房巡检系统 - 机房管理 CRUD + 导出
#
# 用途: 验证机房的新增（含必填校验）/ 查询 / 修改 / 删除 / 导出 全链路
# 备注: 机房是区域、点位的上游基础数据，本用例是后续所有用例的数据前置

test_id: "INSP-PC-002-room-crud"
title: "机房管理：新增 / 查询 / 修改 / 删除 / 导出"
priority: "P0"
tags: ["机房管理", "CRUD", "PC", "E2E"]
author: "testcase-modeler (机房巡检系统)"

context_check:
  login_url: "${PC_URL}/index"
  home_indicator: "机房巡检"
  credentials:
    username: "${PC_USER}"
    password: "${PC_PASS}"
  captcha_required: false

steps:
  # ===== 进入机房管理 =====
  - step: 1
    desc: "进入「机房巡检 > 机房管理」页面"
    action: navigate
    url: "${PC_URL}/inspect/room"
    wait_after:
      type: time
      duration: 2000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/room/list*"
        method: GET
        response_code: 200
        confidence: high

  # ===== 必填校验（反向用例）=====
  - step: 2
    desc: "点击「新增」按钮，打开新增机房窗口"
    action: click
    target: "新增"
    wait_after:
      type: time
      duration: 1200
    assertions:
      - type: element_visible
        target: "机房名称"
        confidence: high

  - step: 3
    desc: "不填写任何内容，直接点击「确 定」，验证必填校验拦截"
    action: click
    target: "确 定"
    wait_after:
      type: time
      duration: 1000
    assertions:
      # 未填必填项时不应发起新增请求，且窗口仍停留在编辑态
      - type: element_visible
        target: "请输入机房名称"
        confidence: medium

  # ===== 正常新增 =====
  - step: 4
    desc: "在新增窗口的「机房名称」输入框填入机房名称"
    action: fill
    target: "请输入机房名称"
    value: "${ROOM_NAME}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 5
    desc: "填入「机房编码」"
    action: fill
    target: "请输入机房编码"
    value: "${ROOM_CODE}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 6
    desc: "填入「机房地址」"
    action: fill
    target: "请输入机房地址"
    value: "${ROOM_ADDR}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 7
    desc: "填入「负责人姓名」（该字段为文本输入框，非下拉）"
    action: fill
    target: "请输入负责人姓名"
    value: "${ROOM_MANAGER}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 8
    desc: "填入「负责人电话」"
    action: fill
    target: "请输入负责人电话"
    value: "${ROOM_PHONE}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 9
    desc: "「状态」选择「正常」（实为 el-radio-group 非 select，index.vue L77；select_option 的 placeholder 定位在 a11y 树中时有时无，改 js 按 form-item label 结构定位）"
    action: js
    script: |
      const norm = s => (s || '').replace(/\s+/g, '');
      const dlg = [...document.querySelectorAll('.el-dialog')].find(d => d.offsetParent !== null);
      if (!dlg) return 'error: room dialog not found';
      const item = [...dlg.querySelectorAll('.el-form-item')]
        .find(i => (i.querySelector('.el-form-item__label')?.textContent || '').trim() === '状态');
      if (!item) return 'error: 状态 form-item not found';
      const radio = [...item.querySelectorAll('.el-radio')].find(r => norm(r.textContent) === '正常');
      if (!radio) return 'error: radio 正常 not found, options=' + [...item.querySelectorAll('.el-radio')].map(r => r.textContent.trim());
      radio.click();
      return new Promise(resolve => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          resolve(radio.classList.contains('is-checked')
            ? 'ok: 状态=正常 checked'
            : 'error: radio 正常 not checked after click');
        }));
      });
    assertions:
      - type: element_text
        expected: "正常"
        confidence: medium

  - step: 10
    desc: "点击「确 定」提交新增"
    action: click
    target: "确 定"
    wait_after:
      type: time
      duration: 2000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/room"
        method: POST
        response_code: 200
        response_body_contains:
          - '"code":200'
        confidence: high
      - type: toast_visible
        expected: "成功"
        confidence: high

  # ===== 查询 =====
  - step: 11
    desc: "在搜索区「机房名称」输入框填入刚创建的机房名称并搜索"
    action: fill
    target: "请输入机房名称"
    value: "${ROOM_NAME}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 12
    desc: "点击「搜索」"
    action: click
    target: "搜索"
    wait_after:
      type: time
      duration: 1500
    assertions:
      - type: text_contains
        expected: "${ROOM_NAME}"
        confidence: high
      - type: network_called
        url_pattern: "*/inspect/room/list*"
        method: GET
        response_code: 200
        confidence: medium

  # ===== 修改 =====
  - step: 13
    desc: "点击目标行操作列的「修改」按钮"
    action: click
    target: "修改"
    wait_after:
      type: time
      duration: 1500
    assertions:
      - type: element_visible
        target: "机房名称"
        confidence: medium

  - step: 14
    desc: "把「负责人姓名」改为带后缀的值，验证修改保存"
    action: fill
    target: "请输入负责人姓名"
    value: "${ROOM_MANAGER}改"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 15
    desc: "点击「确 定」保存修改"
    action: click
    target: "确 定"
    wait_after:
      type: time
      duration: 1800
    assertions:
      - type: network_called
        url_pattern: "*/inspect/room"
        method: PUT
        response_code: 200
        confidence: high
      - type: toast_visible
        expected: "成功"
        confidence: high

  # ===== 导出 =====
  - step: 16
    desc: "点击「导出」按钮"
    action: click
    target: "导出"
    wait_after:
      type: time
      duration: 3000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/room/export*"
        method: POST
        response_code: 200
        confidence: high

  # ===== 删除（可选清理）=====
  - step: 17
    desc: "勾选目标行的复选框"
    action: checkbox
    # target 必须是**行内业务文本**（按行匹配复选框）。原先写「选择该行」是
    # 复选框自身的 aria 标签，行文本里根本没有 → checkbox-error: no row
    # containing target text → 永远勾不上，删除步骤 18/19 级联失败。
    target: "${ROOM_NAME}"
    checked: true
    assertions:
      # checkbox 动作自带校验：切换失败会返回 checkbox-error 并判 FAILED，
      # 无需额外断言（页面无「已选中」字样，element_visible 断言必然假失败）
      - type: element_visible
        target: "删除"
        confidence: low

  - step: 18
    desc: "点击「删除」按钮"
    action: click
    target: "删除"
    wait_after:
      type: time
      duration: 1200
    assertions:
      - type: text_contains
        expected: "确认"
        confidence: medium

  - step: 19
    desc: "在确认框中点击「确 定」完成删除"
    action: click
    target: "确定"
    wait_after:
      type: time
      duration: 1800
    assertions:
      - type: network_called
        url_pattern: "*/inspect/room/*"
        method: DELETE
        response_code: 200
        confidence: high
      - type: toast_visible
        expected: "成功"
        confidence: medium

  # ===== 删后重建（产品缺陷-1 回归 + 数据链恢复）=====

  # 缺陷-1：逻辑删除(@TableLogic) + 物理唯一索引(uk_room_name/uk_room_code)冲突，

  # 删除后同名机房永远无法重建（第 3 轮实测报「数据库中已存在该记录」）。

  # 产品修复 = 删除时对 name/code 追加 _DEL_{id} 后缀腾出物理唯一键 + Service

  # 层 checkUnique。本组步骤验证修复效果，同时恢复 pc-003/004/005 依赖的

  # 「所属机房」选项（本轮实测 pc-002 删除真跑通后数据链断裂 → pc-003 掉到 79%）。

  - step: 20

    desc: "删后重建：点击「新增」重新打开新增机房窗口"

    action: click

    target: "新增"

    wait_after:

      type: time

      duration: 1200

    assertions:

      - type: element_visible

        target: "请输入机房名称"

        confidence: high

  - step: 21

    desc: "重建：填入同名「机房名称」（与已删除机房同名，验证唯一键已腾出）"

    action: fill

    target: "请输入机房名称"

    value: "${ROOM_NAME}"

    assertions:

      - type: field_filled

        expected: "字段已填写"

  - step: 22

    desc: "重建：填入同码「机房编码」"

    action: fill

    target: "请输入机房编码"

    value: "${ROOM_CODE}"

    assertions:

      - type: field_filled

        expected: "字段已填写"

  - step: 23

    desc: "重建：填入「机房地址」"

    action: fill

    target: "请输入机房地址"

    value: "${ROOM_ADDR}"

    assertions:

      - type: field_filled

        expected: "字段已填写"

  - step: 24

    desc: "重建：填入「负责人姓名」"

    action: fill

    target: "请输入负责人姓名"

    value: "${ROOM_MANAGER}"

    assertions:

      - type: field_filled

        expected: "字段已填写"

  - step: 25

    desc: "重建：填入「负责人电话」"

    action: fill

    target: "请输入负责人电话"

    value: "${ROOM_PHONE}"

    assertions:

      - type: field_filled

        expected: "字段已填写"

  - step: 26

    desc: "重建：「状态」点选「正常」（机房表单状态是 el-radio-group 单选钮，非下拉）"

    action: js

    script: |
      const dlg = [...document.querySelectorAll('.el-dialog')].find(d => d.offsetParent !== null);
      if (!dlg) return 'error: room dialog not found';
      const radio = [...dlg.querySelectorAll('.el-radio')].find(r => (r.textContent || '').includes('正常'));
      if (!radio) return 'error: radio 正常 not found in dialog';
      radio.click();
      return new Promise(resolve => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const checked = radio.classList.contains('is-checked');
          resolve(checked ? 'ok: radio 正常 checked' : 'error: radio 正常 not checked after click');
        }));
      });

    assertions:

      - type: element_visible

        target: "正常"

        confidence: high

  - step: 27

    desc: "重建：点击「确 定」提交（修复生效时应成功；未生效报「已存在该记录」）"

    action: click

    target: "确 定"

    wait_after:

      type: time

      duration: 2000

    assertions:

      - type: toast_visible

        expected: "成功"

        confidence: high


teardown:
  - action: screenshot
    name: "room-crud-{timestamp}.png"
    fullPage: true
  - action: log
    message: "机房 CRUD 用例结束；若后续用例需要该机房，请跳过步骤 17-19（删除）"

metadata:
  created_by: "testcase-modeler v2.0.1"
  test_environment: "local"
  viewport: "1920x1080"
  estimated_duration: "60-90s"
  risk_level: "medium"
  note: "步骤 17-19 会删除测试机房，作为独立回归时执行；串联执行请止于步骤 16"
