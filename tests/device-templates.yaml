# ============================================================================
# 设备身份模板库 v3 —— 只保留 Android 14（应要求移除了 Android 16 段）
#   templates ：23 条，全部 certified（逐字真机值）
#   pending   ： 1 条（vivo X90 —— 指纹仍未取到真机值）
# ============================================================================
# 用途：给 test_android_env.py 的 accounts[].device.template 提供现成的设备身份，
#       让每台实例呈现出一台「自洽的真机」而不是模拟器默认值。
#
# 字段与代码的对应关系（DEVICE_SHORT_KEYS）：
#     brand        -> ro.product.brand
#     manufacturer -> ro.product.manufacturer
#     model        -> ro.product.model
#     name         -> ro.product.name
#     device       -> ro.product.device
#     board        -> ro.product.board
#     fingerprint  -> ro.build.fingerprint
#   其余键（android / source / basis / capture / note）是给人看的元数据，
#   代码只读取上面 7 项 + note，多余的键被忽略，不会被下发。
#
# ---------------------------------------------------------------------------
# 键名约定
# ---------------------------------------------------------------------------
#   Android 14 用自然名（xiaomi14 / pixel8 / samsung_s24）。
#   （v2 曾同时收录 Android 16 并用 _a16 后缀区分同机型的两个系统版本，
#    已按本次「只要 14」的要求整段移除；如后续要加回，注意 Pixel 8/8Pro/7/7a/6a
#    会与本节 device 重名，同一批实例只能启用其一。）
#
# ---------------------------------------------------------------------------
# 数据来源（v3 已全部升级为 certified）
# ---------------------------------------------------------------------------
#   Android 14（23 条）
#     来源：Android Dumps（dumps.tadiphone.dev，镜像 gitlab.com/Android-Dumps），
#           逐字取自**官方零售版 ROM 的分区 build.prop**，每条 note 上方都给了可指认的分支 URL。
#     ⚠️ 取值的坑（决定成败）：Android 12+ 的真机身份**不在 system 分区**，
#        而在 odm/etc/build.prop（ro.product.property_source_order =
#        odm,vendor,product,system_ext,system）。system 分区里是
#        `Android/missi_phone_cn_only64/missi` 这类通用值，直接读会全错。
#        三星与 Pixel 的部分机型在 system/system/build.prop —— 必须按机型判别分区。
#
#   ⚠️ 关于 source: certified 的边界
#     本库 v1 用的是 MagiskHidePropsConf 认证指纹库（743 条）；该库已停更在 v102（2020），
#     **最高只到 Android 12，零条 :14/** —— 对 v3 的目标版本零覆盖，故本版改用了上面的来源。
#
# ---------------------------------------------------------------------------
# 关于 board（v3 重要更正）
# ---------------------------------------------------------------------------
#   本库 v1 曾把小米系的 board 填成高通平台代号（pineapple / kalama），**这是错的**：
#   真机 dump 实测，小米 / Redmi / POCO 的 ro.product.board **就是设备代号**本身
#   （houji 的实测值就是 houji），平台名是另一个属性（ro.board.platform）。
#   本版 23 条的 board 全部是**分区实测值**，包括几个反直觉的：
#     · 三星 Exynos 版 = s5e9945 / s5e8845（**不是** pineapple）
#     · 三星骁龙版 / vivo iQOO = pineapple
#     · 联发科天玑机型 = mgvi_64_armv82（厂商占位值，逐字如此，不是笔误）
#     · Pixel / motorola / 大多数小米 = 设备代号
#   另注：模拟器的 ro.board.platform 仍是 goldfish/ranchu 且改不动，
#   board 与它不一致是已知能力边界，不是配置错误（见文档 6 第 8 节）。
#   board 一律**不要留空** —— 留空会让实例暴露模拟器自身的 Build.BOARD。
#
# ---------------------------------------------------------------------------
# 硬约束（代码会硬校验，违反直接判失败）
# ---------------------------------------------------------------------------
#   1. fingerprint 必须是标准五段式且**自洽**：
#        brand/product/device:版本/build_id/incremental:type/tags
#      · brand 段要与 ro.product.brand 一致（忽略大小写）
#      · device 段必须等于 ro.product.device 或 ro.product.name 之一
#      混搭（A 品牌 brand 配 B 品牌 fingerprint）会被风控一眼识破。
#   2. 声明了机型属性却**不给 fingerprint 会被直接判配置错误**——
#      这是有意设计：避免出现「看起来配了机型、指纹其实没改」的假配置。
#      所以 pending 段的条目不能直接启用，必须先把指纹填上。
#   3. 一个型号只能绑一个账号；跨账号重复 device 会被拦下。
#   4. 身份必须在被测 App **首次安装/启动之前**落地
#      （埋点设备 ID 生成一次即持久化，先装后改就得 pm clear 重来）。
#
# ---------------------------------------------------------------------------
# 两种用法
# ---------------------------------------------------------------------------
#   用法 A（推荐）：按模板名引用，代码自动加载本文件
#       accounts:
#         - name: inspector01
#           device:
#             template: xiaomi14        # ← 名字取自下方 templates: 的键
#
#   用法 B：把整段字段复制进 accounts[].device（只复制那 7 个短名）
#
#   查看解析结果：python tests/test_android_env.py --identity-plan
#
# ---------------------------------------------------------------------------
# 拿到逐字真机值的方法（一条命令，比任何拼装值都可靠）
# ---------------------------------------------------------------------------
#   真机插上或 AVD 已启动后执行：
#     adb shell getprop | grep -E \
#       "ro.product.(brand|manufacturer|model|name|device|board)|ro.build.fingerprint"
#   把输出填进对应条目，并把 source 改成 certified。
# ============================================================================

